name: Build, browser QA and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: punch-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SITE_URL: https://punchwallstoescape.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Expand initial source archive when present
        run: |
          if [ -f site-source.zip ]; then
            unzip -q site-source.zip -d /tmp/punch-source
            rsync -a --exclude '.github/workflows/' /tmp/punch-source/punchwallstoescape-site/ ./
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Fix nullable navigation argument in source template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/fixed-template/render.ts')
          s=p.read_text()
          s=s.replace('slugOnly(currentSlug);','slugOnly(currentSlug ?? "");')
          p.write_text(s)
          PY
      - name: Fix mobile content cards and table containers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/site/page-sections.tsx')
          s=p.read_text()
          s=s.replace('className="content-card"', 'className="content-card min-w-0 break-words"')
          s=s.replace('className="mt-7 grid gap-5 md:grid-cols-2"', 'className="mt-7 grid min-w-0 gap-5 md:grid-cols-2"')
          p.write_text(s)
          p=Path('components/site/data-table.tsx')
          s=p.read_text()
          s=s.replace('className="mt-6 overflow-x-auto rounded-theme border border-border"', 'className="mt-6 min-w-0 max-w-full overflow-x-auto rounded-theme border border-border"')
          p.write_text(s)
          p=Path('app/layout.tsx')
          s=p.read_text()
          needle='body[data-fixed-template="guidebook"] .top { position:sticky;top:0;z-index:60; }'
          addition='body[data-fixed-template="guidebook"] .content-card { min-width:0; overflow-wrap:anywhere; }'
          if addition not in s: s=s.replace(needle,needle+'\n          '+addition)
          p.write_text(s)
          PY
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Verify all five HTML and SEO outputs
        run: npm run verify:output
      - name: Install browser for UI and computed CSS QA
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Diagnose mobile overflow elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser-qa.mjs')
          s=p.read_text()
          needle='  if(response.status()!==200'
          extra="  if(data.bodyWidth>width+2){\n    data.offenders=await page.evaluate(()=>[...document.querySelectorAll('body *')]\n      .filter(e=>{const r=e.getBoundingClientRect();return r.right>innerWidth+2&&getComputedStyle(e).display!=='none'})\n      .slice(0,12).map(e=>({tag:e.tagName,class:e.className?.toString().slice(0,80),width:Math.round(e.getBoundingClientRect().width),right:Math.round(e.getBoundingClientRect().right),text:e.textContent?.trim().slice(0,45)})));\n  }\n"
          if needle not in s: raise Exception('browser QA insertion marker not found')
          s=s.replace(needle,extra+needle)
          p.write_text(s)
          PY
      - name: Browser QA at 375, 390, 768 and 1440 widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory out >/tmp/punch-server.log 2>&1 &
          sleep 3
          node scripts/browser-qa.mjs
      - name: Upload browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            qa-browser-results.json
            qa-screenshots/
          if-no-files-found: ignore
      - name: Expand verified archive into readable repository source
        if: success()
        run: |
          if [ -f site-source.zip ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            rm -rf qa-screenshots qa-browser-results.json
            git rm site-source.zip
            git add -A
            prior=$(git log -1 --format=%s)
            next_minor=$(( ${prior#*.} + 1 ))
            git commit -m "1.${next_minor}"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
